  <rect x="80" y="395" width="475" height="75" rx="8" fill="#030712" stroke="#1e293b" />
  <text x="95" y="425" font-family="monospace" font-size="14" font-weight="700" fill="#facc15">9f 01 1a 02 10 e7 19 7a 1f 4b 09 c2 55 e0 92</text>
  <text x="95" y="450" font-family="monospace" font-size="11" fill="#38bdf8">Byte 0 [0x9F]: CC S2 | Byte 1 [0x01]: Encapsulation | Byte 3 [0x02]: Key ID</text>

