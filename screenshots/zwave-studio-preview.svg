    <text x="38" y="331" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Association Group 1 (Lifeline) Controller Mapping</text>

    <rect x="0" y="352" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
