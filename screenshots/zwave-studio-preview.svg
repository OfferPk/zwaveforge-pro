  <text x="80" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">Device Specific Key (DSK) &amp; SmartStart QR:</text>
  <rect x="80" y="510" width="475" height="115" rx="8" fill="#090d16" stroke="#1e293b" />
  <text x="95" y="535" font-family="monospace" font-size="11" fill="#cbd5e1">DSK (128-bit): 12345678901234567890123456789012</text>
  <text x="95" y="558" font-family="monospace" font-size="11" fill="#cbd5e1">SmartStart PIN: <tspan fill="#10b981">04660 (First 5 Decimal Digits Out-of-Band)</tspan></text>
  <text x="95" y="582" font-family="monospace" font-size="11" fill="#facc15">SPAN Freshness: Synchronized Nonce State (No Stale Keystreams)</text>
  <text x="95" y="605" font-family="monospace" font-size="11" fill="#10b981">✓ Verified compliant for Z-Wave Plus v2 &amp; ZWLR Certification</text>


