  <!-- S2 Parameters Box -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="475" height="135" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="15" y="26" font-family="monospace" font-size="12" fill="#94a3b8">Command Class:     <tspan fill="#00E5FF">COMMAND_CLASS_SWITCH_BINARY (0x25)</tspan></text>
    <text x="15" y="50" font-family="monospace" font-size="12" fill="#94a3b8">Command ID:        <tspan fill="#7C4DFF">SWITCH_BINARY_SET (0x01, Val: 0xFF ON)</tspan></text>
    <text x="15" y="74" font-family="monospace" font-size="12" fill="#94a3b8">Security 2 Class:  <tspan fill="#f59e0b">S2_AUTHENTICATED (Key ID: 0x02)</tspan></text>
    <text x="15" y="98" font-family="monospace" font-size="12" fill="#94a3b8">Node ID Addressing:<tspan fill="#10b981">Node 12 (Classic Mesh 1-232 / ZWLR 1-4000)</tspan></text>
    <text x="15" y="122" font-family="monospace" font-size="12" fill="#38bdf8">Encryption Engine: <tspan fill="#facc15">AES-128-CCM (8-Byte MAC Authentication Tag)</tspan></text>
