    <text x="20" y="375" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">State Change Unsolicited Report Feedback Loop</text>

    <rect x="0" y="396" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="415" r="8" fill="#10b981" />
    <text x="20" y="419" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="419" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Power Profile &amp; Listening Mode Conformance (FLiRS / Sleeping)</text>
