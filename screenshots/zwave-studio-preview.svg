  <text x="95" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00E5FF" text-anchor="middle">📡</text>
  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">ZWaveForge <tspan fill="#00E5FF">Pro</tspan></text>
  <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Z-Wave Plus v2 / ZWLR S2 Security Studio &amp; ITU-T G.9959 Auditor</text>

  <!-- Status badges -->
  <rect x="850" y="68" width="110" height="32" rx="16" fill="#00E5FF" opacity="0.1" stroke="#00E5FF" stroke-width="1" />
  <text x="905" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">Z-Wave S2</text>
  <rect x="975" y="68" width="145" height="32" rx="16" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1" />
  <text x="1047" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">AUDIT: 10/10 PASS</text>

